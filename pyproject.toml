[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macro-tool"
version = "2.0.0"
description = "Record and replay mouse and keyboard macros, with an auto clicker, on Windows, macOS and Linux (X11 and Wayland)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YatoVoid" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7.6",
    "evdev>=1.6; sys_platform == 'linux'",
]
keywords = ["macro", "auto clicker", "automation", "wayland", "x11"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/YatoVoid/Macro-Tool"
Issues = "https://github.com/YatoVoid/Macro-Tool/issues"

[project.scripts]
macro-tool-cli = "macrotool.cli:main"

[project.gui-scripts]
macro-tool = "macrotool.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macrotool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
